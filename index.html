<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Sale</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<header>
    <h1>🛒 Product Sale</h1>
</header>


<main>

    <!-- ============================= -->
    <!-- NEW SALE -->
    <!-- ============================= -->

    <section class="card">

        <h2>نئی Sale</h2>

        <div class="barcode-row">

            <input
                id="barcode"
                placeholder="Barcode / Product Code"
            >

            <button
                type="button"
                onclick="openSaleCamera()"
                class="camera-btn"
            >
                📷
            </button>

        </div>


        <!-- Sale Camera -->

        <input
            id="saleCamera"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
            onchange="salePhotoTaken(event)"
        >


        <!-- Sale Photo -->

        <img
            id="salePhotoPreview"
            class="photo-preview"
            style="display:none;"
        >


        <button
            type="button"
            onclick="searchProduct()"
            class="main-btn"
        >
            Product تلاش کریں
        </button>


        <input
            id="productName"
            placeholder="Product Name"
        >


        <div class="row">

            <input
                id="purchasePrice"
                type="number"
                placeholder="Purchase Price"
            >

            <input
                id="salePrice"
                type="number"
                placeholder="Sale Price"
            >

        </div>


        <input
            id="quantity"
            type="number"
            min="1"
            value="1"
            placeholder="Quantity"
        >


        <button
            type="button"
            onclick="saveSale()"
            class="main-btn"
        >
            Sale Save کریں
        </button>

    </section>



    <!-- ============================= -->
    <!-- NEW PRODUCT -->
    <!-- ============================= -->

    <section class="card">

        <h2>نیا Product محفوظ کریں</h2>

        <p class="hint">
            Product کا نام، prices اور تصویر محفوظ کریں۔
        </p>


        <div class="barcode-row">

            <input
                id="newBarcode"
                placeholder="Barcode / Product Code"
            >

            <button
                type="button"
                onclick="openProductCamera()"
                class="camera-btn"
            >
                📷
            </button>

        </div>


        <input
            id="newName"
            placeholder="Product Name"
        >


        <div class="row">

            <input
                id="newCost"
                type="number"
                placeholder="Purchase Price"
            >

            <input
                id="newPrice"
                type="number"
                placeholder="Sale Price"
            >

        </div>


        <!-- Product Camera -->

        <input
            id="productPhoto"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
            onchange="previewPhoto(event)"
        >


        <button
            type="button"
            onclick="openProductCamera()"
            class="photo-btn"
        >
            📷 Product کی تصویر لیں
        </button>


        <img
            id="photoPreview"
            class="photo-preview"
            style="display:none;"
        >


        <button
            type="button"
            onclick="saveProduct()"
            class="main-btn"
        >
            Product Save کریں
        </button>

    </section>



    <!-- ============================= -->
    <!-- TODAY SALES -->
    <!-- ============================= -->

    <section class="card">

        <h2>آج کی Sales</h2>

        <div id="salesList">
            ابھی کوئی آج کی Sale نہیں۔
        </div>

    </section>

</main>


<script src="app.js"></script>

</body>

</html>
