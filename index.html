<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAIM KTK - Product Sale</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🛒 Product Sale</h1>
</header>


<main>

  <!-- =========================================
       SALE SECTION
  ========================================== -->

  <section class="card">

    <h2>نئی Sale</h2>

    <div class="barcode-row">

      <input
        id="barcode"
        type="text"
        placeholder="Barcode / Product Code"
      >

      <button
        type="button"
        class="camera-btn"
        onclick="document.getElementById('barcode').focus()"
      >
        📷
      </button>

    </div>


    <button
      type="button"
      onclick="searchProduct()"
      class="main-btn"
    >
      Product تلاش کریں
    </button>


    <input
      id="productName"
      type="text"
      placeholder="Product Name"
    >


    <div class="row">

      <input
        id="purchasePrice"
        type="number"
        placeholder="Purchase Price"
      >

      <input
        id="salePrice"
        type="number"
        placeholder="Sale Price"
      >

    </div>


    <input
      id="quantity"
      type="number"
      min="1"
      value="1"
      placeholder="Quantity"
    >


    <button
      type="button"
      onclick="saveSale()"
      class="main-btn"
    >
      Sale Save کریں
    </button>

  </section>



  <!-- =========================================
       NEW PRODUCT SECTION
  ========================================== -->

  <section class="card">

    <h2>نیا Product محفوظ کریں</h2>


    <p class="hint">
      Product کا barcode، نام، prices اور تصویر save کریں۔
    </p>


    <!-- BARCODE -->

    <div class="barcode-row">

      <input
        id="newBarcode"
        type="text"
        placeholder="Barcode / Product Code"
      >

      <label
        for="productPhoto"
        class="camera-btn"
      >
        📷
      </label>

    </div>


    <!-- PRODUCT NAME -->

    <input
      id="newName"
      type="text"
      placeholder="Product Name"
    >


    <!-- PRICES -->

    <div class="row">

      <input
        id="newCost"
        type="number"
        placeholder="Purchase Price"
      >

      <input
        id="newPrice"
        type="number"
        placeholder="Sale Price"
      >

    </div>



    <!-- =========================================
         CAMERA / PHOTO INPUT
    ========================================== -->

    <input
      id="productPhoto"
      type="file"
      accept="image/*"
      capture="environment"
      style="display:none;"
    >


    <!-- CAMERA BUTTON -->

    <label
      for="productPhoto"
      class="photo-btn"
    >
      📷 Product کی تصویر لیں
    </label>


    <!-- PHOTO PREVIEW -->

    <img
      id="photoPreview"
      class="photo-preview"
      style="display:none;"
      alt="Product Photo"
    >


    <!-- SAVE PRODUCT -->

    <button
      type="button"
      onclick="saveProduct()"
      class="main-btn"
    >
      Product Save کریں
    </button>

  </section>



  <!-- =========================================
       TODAY SALES
  ========================================== -->

  <section class="card">

    <h2>آج کی Sales</h2>

    <div id="salesList"></div>

  </section>


</main>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="app.js"></script>

</body>
</html>
