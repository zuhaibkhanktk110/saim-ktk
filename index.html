<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Sale</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🛒 Product Sale</h1>
</header>

<main>

  <!-- SALE -->
  <section class="card">
    <h2>نئی Sale</h2>

    <div class="barcode-row">
      <input id="barcode" placeholder="Barcode / Product Code">
      <button onclick="scanProduct()" class="camera-btn">📷</button>
    </div>

    <button onclick="searchProduct()" class="main-btn">
      Product تلاش کریں
    </button>

    <input id="productName" placeholder="Product Name">

    <div class="row">
      <input id="purchasePrice" type="number" placeholder="Purchase Price">
      <input id="salePrice" type="number" placeholder="Sale Price">
    </div>

    <input id="quantity" type="number" min="1" value="1">

    <button onclick="saveSale()" class="main-btn">
      Sale Save کریں
    </button>
  </section>


  <!-- NEW PRODUCT -->
  <section class="card">
    <h2>نیا Product محفوظ کریں</h2>

    <p class="hint">
      Product کا barcode، نام، prices اور تصویر save کریں۔
    </p>

    <div class="barcode-row">
      <input id="newBarcode" placeholder="Barcode / Product Code">
      <button onclick="openCamera()" class="camera-btn">📷</button>
    </div>

    <input id="newName" placeholder="Product Name">

    <div class="row">
      <input id="newCost" type="number" placeholder="Purchase Price">
      <input id="newPrice" type="number" placeholder="Sale Price">
    </div>

    <!-- PRODUCT PHOTO -->
    <input
      id="productPhoto"
      type="file"
      accept="image/*"
      capture="environment"
      onchange="previewPhoto(event)"
      hidden
    >

    <button onclick="openCamera()" class="photo-btn">
      📷 Product کی تصویر لیں
    </button>

    <img id="photoPreview" class="photo-preview">

    <button onclick="saveProduct()" class="main-btn">
      Product Save کریں
    </button>
  </section>


  <!-- SALES -->
  <section class="card">
    <h2>آج کی Sales</h2>
    <div id="salesList"></div>
  </section>

</main>

<script src="app.js"></script>

</body>
</html>
